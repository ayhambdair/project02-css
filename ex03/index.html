<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Color Models</h1>

    <div class="color-container">
        <div class="color-box named">Named Color</div>
        <div class="color-box hex">HEX Color</div>
        <div class="color-box rgb">RGB Color</div>
        <div class="color-box rgba">RGBA Color</div>
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">
        <div class="example opacity-box">
            <h3>Opacity: 0.5</h3>
            <p>This text also becomes transparent.</p>
        </div>

        <div class="example rgba-box">
            <h3>RGBA Alpha: 0.5</h3>
            <p>This text keeps its full opacity.</p>
        </div>
    </div>

</body>
</html>
